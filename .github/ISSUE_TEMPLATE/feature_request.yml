name: Feature request
description: Suggest an idea for one of the mods
labels: ["enhancement"]
body:
  - type: dropdown
    id: mod
    attributes:
      label: Mod
      options: ["claims", "webmap", "clientmap", "claims-api", "New mod / other"]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
