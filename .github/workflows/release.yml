name: Release

# Push a tag <module>-v<version> (e.g. claims-v0.1.0) to build that mod and publish its jar on GitHub Releases.
on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check tag, version and changelog
        id: info
        run: python3 .github/scripts/release_info.py "${GITHUB_REF_NAME}" release-notes.md
      - name: Build and test
        run: ./gradlew ":${{ steps.info.outputs.module }}:build" --stacktrace
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE: ${{ steps.info.outputs.module }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          shopt -s nullglob
          jars=()
          for jar in "$MODULE"/build/libs/*-"$VERSION".jar; do jars+=("$jar"); done
          if [ ${#jars[@]} -eq 0 ]; then echo "::error::No jar found for $MODULE $VERSION"; exit 1; fi
          gh release create "$GITHUB_REF_NAME" "${jars[@]}" \
            --title "$MODULE $VERSION" \
            --notes-file release-notes.md \
            --verify-tag
