name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build --stacktrace
      - name: Game tests (claims)
        run: ./gradlew :claims:runGameTestServer --stacktrace
      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: jars
          path: "*/build/libs/*.jar"
