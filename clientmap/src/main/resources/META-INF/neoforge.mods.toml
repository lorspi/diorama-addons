modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},1.21.2)"
ordering = "NONE"
side = "BOTH"

# Optional integration: this mod works without it.
[[dependencies.${mod_id}]]
modId = "${mod_id_prefix}_claims"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "${mod_id_prefix}_claims_api"
type = "required"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# Optional: the client integration works with the Diorama versions listed in DioramaCompat.SUPPORTED.
[[dependencies.${mod_id}]]
modId = "diorama"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "CLIENT"

[[mixins]]
config = "${mod_id}.diorama.mixins.json"
